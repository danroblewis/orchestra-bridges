# {{name}}: a poller scaffolded from the orchestra-bridges kit `slack`: a relay of who posted in a
# few channels, never a machine itself (the machines are the people and bots it publishes as).
# Read by its own program ({{name}}.py: [settings], clearance) and by the Supervisor (description,
# engagement, [[publishes]]); never by Orchestra, which knows the actors by their events.
# For mentions of you and whether you answered, the bridges' own Slack reader ([bridges.slack]) is the tool.
name = "{{name}}"
kit = "slack"
description = "Polls a few Slack channels every 5 minutes and relays each message as slack.message.posted, as who posted it; measure prints the messages per channel in the last hour."
engagement = "scheduled"
created_by = "orchestra bridges scaffold"
# The compliance check: until the owner approves reading Slack (then "approved", with the data
# class), the program reads only a fake on this machine.
clearance = "needs approval"
data_class = "unknown"

[settings]
base_url = "https://slack.com"
token_env = "SLACK_TOKEN"         # the NAME of the variable holding the token; never the token
# token_file = "~/.config/orchestra-bridges/{{kind}}-token"   # instead: a chmod 600 file outside any repository
every = "5m"
per_minute = 20                   # conversations.history is Tier 3 (50 a minute); stay under it
ttl = "4m"
channels = ["C001"]               # channel ids, not names
lookback_s = 86400                # how far back the first poll reads

[[publishes]]
type = "slack.message.posted"
subject = "<channel>/<thread ts>"
