# {{name}}: a poller scaffolded from the orchestra-bridges kit `http`, for a JSON API no kit knows: a
# relay of what people and bots did there, never a machine itself (the machines are the actors it
# publishes as). Read by its own program ({{name}}.py: [settings], clearance) and by the Supervisor
# (description, engagement, [[publishes]]); never by Orchestra, which knows the actors by their events.
name = "{{name}}"
# kit: the template it came from, and the system's name in [bridges.kits] tokens: when token_env
# below is not set, the token's variable is the project's tokens.<kit> (tokens = { jira = "JIRA_API_TOKEN" }).
kit = "http"
description = "Polls a JSON API's list endpoint every 5 minutes and relays each item's change of state as <system>.<thing>.<state>, as who made it; measure prints the items by state."
engagement = "scheduled"
created_by = "orchestra bridges scaffold"
# The compliance check: until the owner approves reading the system (then "approved", with the
# data class), the program reads only a fake on this machine.
clearance = "needs approval"
data_class = "unknown"

[settings]
base_url = "https://ci.example.com"      # guess: ask the owner (the API's root)
token_env = "{{token_env}}"              # the NAME of the variable holding the token; never the token
# token_file = "~/.config/orchestra-bridges/{{name}}-token"   # instead: a chmod 600 file outside any repository
every = "5m"
per_minute = 20
ttl = "4m"
system = "example"                # guess: ask the owner. The event types' and the series' first word (jenkins, argo, ...)
thing = "item"                    # guess: ask the owner. What one item is (build, job, ticket): <system>.<thing>.<state>
list_path = "/api/items"          # guess: from the API's docs. The list endpoint, under base_url
params = {}                       # guess: ask the owner (the filter is the scope). Its query parameters (a page size, a filter)
items = "items"                   # where the list is in the answer: a dotted path ("" for an answer that is the list)
key = "id"                        # each item's own id (dotted path): the event's subject
stamp = "updated_at"              # what changes when the item does (an updated time, a version): emitted once per stamp
state = "status"                  # its state (dotted path): the event type's last word and the gauge's label
actor = "updated_by"              # who changed it last (dotted path): person.<system>.<account>; "" or missing: bot.<system>
actor_is_bot = ""                 # a dotted path to a boolean saying the actor is a bot (bot.<system>.<account>); "" for none
time = "updated_at"               # when it changed (dotted path, RFC 3339); "" for now

[[publishes]]
type = "<system>.<thing>.<state>"
subject = "the item's id"
