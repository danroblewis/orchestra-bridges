# {{name}}: a poller scaffolded from the orchestra-bridges kit `jira`: a relay of what people did in
# Jira, never a machine itself (the machines are the actors it publishes as).
# Read by its own program ({{name}}.py: [settings], clearance) and by the Supervisor (description,
# engagement, [[publishes]]); never by Orchestra, which knows the actors by their events.
name = "{{name}}"
# kit: the template it came from, and the system's name in [bridges.kits] tokens: when token_env
# below is not set, the token's variable is the project's tokens.<kit> (tokens = { jira = "JIRA_API_TOKEN" }).
kit = "jira"
description = "Polls Jira every 5 minutes and relays each issue created, assigned and moved and each comment added (jira.issue.created, .assigned, .transitioned, jira.comment.added), as who did it; measure prints the issues in scope by status."
engagement = "scheduled"
created_by = "orchestra bridges scaffold"
# The compliance check: until the owner approves reading Jira (then "approved", with the data
# class), the program reads only a fake on this machine.
clearance = "needs approval"
data_class = "unknown"

[settings]
base_url = "https://jira.example.com"   # guess: ask the owner (a Data Center host, or https://<site>.atlassian.net)
# edition: "datacenter" (REST API v2, /search with startAt, a personal access token as Bearer, people
# by user name) or "cloud" (REST API v3, /search/jql with nextPageToken, an API token with the
# account's email as HTTP Basic, people by account id); "auto": cloud on *.atlassian.net, else
# datacenter (a Cloud site on its own domain needs "cloud"). Not set: cloud. Once cleared,
# `python {{name}}.py edition` prints what the site's serverInfo says. The events are the same.
edition = "auto"                  # guess: ask the owner (or the serverInfo's deploymentType)
token_env = "JIRA_API_TOKEN"      # the NAME of the variable holding the token; never the token
# token_file = "<path to the token file>"   # instead (Data Center: the PAT): a chmod 600 file outside any repository
# user_file = "<path to the account file>"    # Cloud: the account the token belongs to (or user_env)
every = "5m"
per_minute = 20
ttl = "4m"
jql = "project = ABC"             # guess: ask the owner (the issues in scope; no ORDER BY, the poller adds its own)
# users: a team, by their Jira user names (Data Center) or account ids (Cloud): the scope becomes
# (jql) AND (assignee in (...) OR reporter in (...)); empty: the jql alone. A sprint board's
# members are a good start (the board's filter names them, or its issues' assignees).
users = []
# sprint_field: the Agile sprint field's id on this Jira (Data Center: customfield_<n>, the one whose
# name is "Sprint" in /rest/api/2/field); set, each event carries the issue's sprint's name (the
# open one, else the latest). Empty: no sprint.
sprint_field = ""
since = "now"                     # where the first run starts: "now", a duration back ("7d"), or an ISO time
# history: "window" (the first run relays only what changed since `since`, of issues not yet done) or
# "full" (it relays the whole history of every issue updated since `since`, finished ones included,
# each change at its own time and marked replayed: a workflow that offers work refuses a replay)
history = "window"
# display_names: the name Jira shows for each account rides on its announcement as display_name, a
# detail on its card; the machine's name is always the account's (jira.user.<user name>; on Cloud,
# derived from the display name and marked so). An account is not a person: only the identity map
# ([bridges] people) joins accounts into person.<key>. false: no display name is kept
display_names = true
# content: what of each issue's text is relayed besides its metadata: "summary" (its title, on every
# event), "description" (on its creation, at most 4000 characters) and "comments" (each comment's
# text, at most 4000). Empty: metadata only (keys, accounts, statuses, times). Every event carries
# the issue's link (`url`) either way. The text stays on this machine, on the bus and in the items.
content = []
overlap = "10m"                   # each poll re-reads this much before the last one

[[publishes]]
type = "jira.issue.created"
subject = "the issue key (ABC-12)"
source = "its creator: person.jira.<account>"
data = "status, category, issuetype, labels (and sprint, with sprint_field): the issue now"

[[publishes]]
type = "jira.issue.assigned"
subject = "the issue key"
source = "who assigned it: person.jira.<account> (bot.jira when no one)"
data = "assignee: the account it went to (none: unassigned); status, category, issuetype, labels: the issue now"

[[publishes]]
type = "jira.issue.transitioned"
subject = "the issue key"
source = "who moved it: person.jira.<account> (bot.jira when no one)"
data = "from, to: the status names; status, category, issuetype, labels: the issue now"

[[publishes]]
type = "jira.comment.added"
subject = "the issue key"
source = "the comment's author: person.jira.<account>"
data = "issue, author: the issue key and the author's account (never the comment's text)"
